    strict: true
    evidence: "65 / 345"

  - name: Tablazo
    kind: formation
    age: "Cretácico Inferior (Aptiano–Albiano)"            # CHECK
    overlies: Paja
    evidence: "219 / 529"

  - name: Simití
    kind: formation
    age: "Cretácico Inferior (Albiano)"      # CHECK
    overlies: Tablazo
