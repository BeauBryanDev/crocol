# Curated VMM stratigraphic units for the knowledge graph (kg.entities).
# Draft 2026-10-18 from the corpus; the owner reviews every '# CHECK'.
#
# name     canonical name, identical to corpus_metadata.yaml `formations`
# kind     formation | member | group
# part_of  the group or formation this unit belongs to
# overlies the unit directly below (stratigraphic order, bottom to top)
# aliases  spelling variants only; "Formación X", "Fm. X", "X Formation",
#          "Grupo X", "Miembro X" and "X Member" are generated by the loader
# strict   true when the bare name is a common word, a municipality or a
#          field, so it links only next to a cue word ("Formación", "Fm.",
#          "Grupo", "Miembro", "Formation", "Group", "Member")
# evidence corpus counts on 2026-10-18  

version: 1

units:
  - name: Basamento
    kind: formation
    age: "Precámbrico–Paleozoico"            # CHECK
    aliases: [Basement, Basamento cristalino, Crystalline Basement]
    evidence: "0 / 189"

  - name: Noreán
    kind: formation
    age: "Jurásico inferior–medio"            
    overlies: Basamento                      
    aliases: [Norean]
    evidence: "58 / 73"

  - name: Girón
    kind: group
    age: "Jurásico"                        
    overlies: Basamento
    strict: true                            
    evidence: "43 / 76"

  - name: Jordán
    kind: formation
    age: "Jurásico"                          
    overlies: Basamento                   
    strict: true
    evidence: "2 / 20"

  - name: Bocas
    kind: formation
    age: "Triásico–Jurásico"                 # CHECK
    strict: true
    evidence: "3 / 30"

  - name: Los Santos
    kind: formation
    age: "Cretácico Inferior (Berriasiano–Valanginiano)"   # CHECK
    overlies: Girón
    strict: true                              
    evidence: "25 / 71"

  - name: Tambor
    kind: formation
    age: "Cretácico Inferior"                # CHECK
    overlies: Girón
    equivalent_of: Los Santos                
    aliases: [Conglomerado Basal, Unidad Conglomerática de Arenal]
    evidence: "29 / 46"

  - name: Cumbre
    kind: formation
    age: "Cretácico Inferior (Valanginiano)" # CHECK
    overlies: Los Santos
    strict: true
    evidence: "27 / 47"

  - name: Rosablanca
    kind: formation
    age: "Cretácico Inferior (Hauteriviano–Barremiano)"    # CHECK
    overlies: Cumbre                        
    aliases: [Rosa Blanca]
    evidence: "72 / 159"

  - name: Paja
    kind: formation
    age: "Cretácico Inferior (Barremiano–Aptiano)"         # CHECK
