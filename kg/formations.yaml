  - name: Galembo
    kind: member
    part_of: La Luna
    overlies: Pujamana
    age: "Coniaciano–Santoniano"             # CHECK
    evidence: "318 / 557"

  - name: Umir
    kind: formation
    age: "Cretácico Superior (Campaniano–Maastrichtiano)"  # CHECK
    overlies: La Luna
    evidence: "134 / 205"

  - name: Lisama
    kind: formation
